name: CI checks

# Runs on every pull request. Nothing here touches AWS: `cdk synth` only
# needs the TypeScript to compile and the stacks to validate, and the
# CloudFront Function tests run against the source files with plain Node.
# The lint job runs ESLint, Prettier and ruff over every source file plus
# the refresh-simple-trigger Lambda tests; the versions it installs match
# package.json and requirements-dev.txt.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra:
    name: CDK synth and function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - name: Install the CDK app
        run: npm ci
        working-directory: infra/cdk
      - name: Typecheck and test the CDK app
        run: npm run typecheck && npm test
        working-directory: infra/cdk
      - name: Synth every stack (no credentials)
        run: npx cdk synth
        working-directory: infra/cdk
      - name: Test the CloudFront Function pieces
        run: node --test "infra/cloudfront/test/*.test.js"
      - name: Test the preview-site naming script
        run: node --test "infra/preview/test/*.test.js"
      - name: Test the DFENS Simple check script (stdlib only)
        run: python3 -m unittest discover -s simple/pipeline -p "test_*.py"

  # The alerts pipeline's tests import scripts/data.py, which needs
  # geopandas and duckdb, so they run in the same pinned environment the
  # pipeline itself uses. The environment is cached by file contents.
  pipeline:
    name: Pipeline tests (pinned environment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Test the alerts pipeline modules
        shell: bash -el {0}
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the lint tooling
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: ruff check
        run: ruff check scripts simple/pipeline infra/lambda
      - name: ruff format
        run: ruff format --check scripts simple/pipeline infra/lambda
      - name: Test the refresh-simple-trigger Lambda (stdlib only)
        run: python3 -m unittest
        working-directory: infra/lambda/refresh-simple-trigger
      - name: Check the dashboards' CDN integrity hashes (downloads from unpkg)
        run: node --test "simple/test/*.test.js"
