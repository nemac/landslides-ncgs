name: PR preview site

# Every open pull request into development gets its own password-protected
# site at pr-<number>.landslidesncgs.org. Each push redeploys it from the
# merge of the branch into development, so it shows what merging would do;
# closing or merging the pull request deletes it. The pull request number
# names the site, so two pull requests can never share one.
#
# All previews share one bucket, one folder per pull request, and one
# distribution that claims *.landslidesncgs.org (the Web stack). The role
# ARN and distribution id come from the CDK outputs (infra/README.md). Pull
# requests from forks are skipped: they get no OIDC token, and the preview
# role should only ever run this repo's own branches.

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read

# A newer push, or the close, supersedes whatever this pull request's
# previous run was still doing.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed'
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: preview
      role_arn: arn:aws:iam::710482330128:role/landslides-github-preview
      bucket: landslidesncgs-preview-site
      distribution_id: E1W9MDWC0X94YW
      site_url: https://pr-${{ github.event.pull_request.number }}.landslidesncgs.org
      folder: pr-${{ github.event.pull_request.number }}

  remove:
    name: Remove the preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      FOLDER: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710482330128:role/landslides-github-preview
          aws-region: us-east-1

      - name: Delete the preview's folder
        run: aws s3 rm "s3://landslidesncgs-preview-site/$FOLDER/" --recursive

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1W9MDWC0X94YW \
            --paths "/*" \
            --query 'Invalidation.Id' --output text
