name: Refresh DFENS Simple data (every 10 min)

# Data pipeline for the DFENS Simple dashboard at /simple/ (simple/pipeline/).
# Nothing is committed to git; outputs go straight to
# s3://landslidesncgs-data/simple/data/. The debris-flow GeoPackage it
# intersects against, and the WNC fire district file it tags flagged
# pathways with, are kept current in the same bucket under cache/ by
# refresh-reference.yml, so a heavy-rain build downloads them instead of
# re-fetching 225k polygons and the districts.
#
# Each run:
#   1. ndfd_check.py (stdlib, ~5 s): has NDFD changed since the last
#      published status.json?
#        skip  -> only status.json is re-uploaded (heartbeat for the page)
#        build -> step 2
#   2. refresh_simple.py (geopandas): writes the forecast layer; if any
#      >= 5" polygons are over WNC (heavy=true), also intersects them with
#      the cached debris flows. Writes forecast, flagged file and status.
#
# GitHub cron is best-effort and, for this repo, hours late (the daily job
# has started 4-8 h late on every run; measured 2026-10-21). The real
# 10-minute trigger is therefore EventBridge Scheduler + a Lambda that
# calls workflow_dispatch (see infra/lambda/refresh-simple-trigger/). The
# cron below is kept only as a backup; duplicate runs are serialized by
# the concurrency group. Runs can still start a few minutes late under
# load. Worst-case lag from an Esri update to the page is roughly
# cron interval + start delay + run time (~30 s skip, ~1-2 min build,
# ~3-5 min build with heavy rain, ~20 min if the GeoPackage must be fetched).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if NDFD hasn't changed"
        type: boolean
        default: false

concurrency:
  group: refresh-simple
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::710482330128:role/landslides-github-prod
  S3_DATA: s3://landslidesncgs-data/simple/data
  STATUS_URL: https://landslidesncgs.org/simple/data/status.json
  CHECK_INTERVAL_MINUTES: "10"     # keep in step with the cron above
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (stdlib check)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check NDFD for changes
        id: check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python simple/pipeline/ndfd_check.py --out out

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- Build path: NDFD changed ------------------------------------
      # The debris-flow GeoPackage (~570 MB) is only needed when there is
      # >= 5" rain over WNC to intersect. If the bucket has none yet,
      # refresh_simple.py fetches the layer itself (~20 min).
      - name: Fetch the debris-flow GeoPackage
        if: steps.check.outputs.action == 'build' && steps.check.outputs.heavy == 'true'
        run: |
          mkdir -p cache
          aws s3 cp "s3://landslidesncgs-data/cache/debris_flows.gpkg" cache/debris_flows.gpkg \
            || echo "No GeoPackage in the bucket yet; the build will fetch the layer itself."

      # The fire district file (~50 MB) tags each flagged pathway with its
      # fire district, so it is needed in the same case. If the bucket has
      # none yet, refresh_simple.py downloads the districts itself.
      - name: Fetch the fire district file
        if: steps.check.outputs.action == 'build' && steps.check.outputs.heavy == 'true'
        run: |
          mkdir -p cache
          aws s3 cp "s3://landslidesncgs-data/cache/fire_districts_wnc.geojson" cache/fire_districts_wnc.geojson \
            || echo "No fire district file in the bucket yet; the build will fetch the districts itself."

      # The same pinned environment as the alerts pipeline, so the shared
      # modules (scripts/data.py, scripts/analysis.py) run on the same
      # library versions in both places. Cached by file contents.
      - name: Set up environment (micromamba)
        if: steps.check.outputs.action == 'build'
        uses: ./.github/actions/setup-conda-env

      - name: Build forecast + flagged files
        if: steps.check.outputs.action == 'build'
        shell: bash -el {0}
        run: python simple/pipeline/refresh_simple.py --out out

      # ---- Publish ------------------------------------------------------
      # Data files first, then status, so the status never points at
      # data that isn't up yet. Short max-age so CloudFront and browsers
      # pick up new files within a minute without an invalidation.
      - name: Upload forecast + flagged files
        if: steps.check.outputs.action == 'build'
        run: |
          for f in forecast_24h.geojson flagged_ndfd_24h_min11.geojson; do
            aws s3 cp "out/$f" "$S3_DATA/$f" \
              --content-type application/json \
              --cache-control "public, max-age=60"
          done

      - name: Upload status
        run: |
          aws s3 cp out/status.json "$S3_DATA/status.json" \
            --content-type application/json \
            --cache-control "public, max-age=30"

      # A run that flagged any pathways is kept for good: the three files are
      # copied to simple/archive/<generated_at>/ in the same bucket, a prefix
      # CloudFront does not serve and the bucket's lifecycle rule does not
      # touch. Old versions of the live files expire after 30 days; these
      # copies are current objects and stay.
      - name: Archive a run that flagged pathways
        if: steps.check.outputs.action == 'build'
        run: |
          # archive_decision.py says no when nothing was flagged, and when
          # this build was a repeat of a failed fire district lookup that
          # failed again (the first run for that forecast is already kept).
          if [ "$(python3 simple/pipeline/archive_decision.py --out out)" = "true" ]; then
            STAMP=$(python3 -c "import json; print(json.load(open('out/status.json'))['generated_at'][:19].replace(':', '') + 'Z')")
            DEST="s3://landslidesncgs-data/simple/archive/${STAMP}"
            # The rain input file is kept only here, never published. NDFD
            # serves only the current forecast, so this is the one copy of
            # the rain polygons the flagging used.
            for f in forecast_24h.geojson flagged_ndfd_24h_min11.geojson status.json rain_input_ndfd_24h_min11.geojson; do
              aws s3 cp "out/$f" "$DEST/$f" --content-type application/json
            done
            echo "Archived this run to $DEST"
          else
            echo "Nothing archived: no flagged pathways, or a repeat of a failed fire district lookup."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### NDFD refresh"
            echo "- Action: \`${{ steps.check.outputs.action }}\`"
            [ -f out/check.json ] && echo '```json' && cat out/check.json && echo && echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
