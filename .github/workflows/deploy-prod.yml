name: Deploy to production (S3 + CloudFront)

# Fires on any push to `master`. Also runnable on demand from the Actions
# tab. The work is in deploy-site.yml; this file only names the production
# values. The role ARN and distribution id come from the CDK outputs
# (infra/README.md) and are filled in during the cutover.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
      role_arn: arn:aws:iam::710482330128:role/landslides-github-prod
      bucket: landslidesncgs-site
      distribution_id: E2ERQC7EESP0UJ
      site_url: https://landslidesncgs.org
