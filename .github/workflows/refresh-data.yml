name: Refresh alert data (daily)

# Runs the DEFNS data pipeline (scripts/refresh.py) and uploads alerts/data/
# straight to the data bucket. Nothing is committed to git: the data lives
# only in S3, and the short Cache-Control on the files means CloudFront
# serves the new versions within minutes with no invalidation.
#
# Trigger: EventBridge Scheduler in the AWS account dispatches this workflow
# at 04:00 UTC every day (infra/lambda/refresh-simple-trigger/). The cron
# below is only a backup; GitHub's scheduler runs hours late for this repo.
#
# Cost: $0 — public repo. No secrets: every upstream source is public and
# the upload assumes an OIDC role (no stored AWS keys).

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# Never run two refreshes at once.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  id-token: write   # assume the AWS role with OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::710482330128:role/landslides-github-prod
  DATA_BUCKET: landslidesncgs-data
  DATA_PREFIX: alerts/data

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Most days the debris gpkg is a cache hit and the run is quick. Headroom
    # is for the cold path: the first run of each month re-fetches the ~225k
    # NCGS debris polygons + augments them (several minutes) before the cache
    # repopulates, plus the ~monthly ~754 MB Overture buildings extract.
    timeout-minutes: 60

    # The `production` environment is what the IAM role's trust policy is
    # scoped to (sub = repo:nemac/landslides-ncgs:environment:production).
    environment: production

    env:
      # Stream refresh.py's progress live. Python block-buffers stdout when it
      # isn't a TTY (as in CI), so without this the logs stay dark until the
      # process exits, making a slow run impossible to diagnose in real time.
      PYTHONUNBUFFERED: "1"
      # Bound GDAL's HTTP layer. The MRMS reader opens remote GRIB via
      # rasterio "/vsigzip//vsicurl/<url>", which uses GDAL's HTTP client —
      # and unlike the requests-based fetchers it has NO default timeout. A
      # stalled connection to IEM's mtarchive server otherwise hangs the whole
      # job until the 45-min step timeout kills it (observed 2026-07-20). These
      # make a stuck read fail fast so the Pass1->RadarOnly->Pass2 fallback
      # chain can move on.
      GDAL_HTTP_TIMEOUT: "30"
      GDAL_HTTP_CONNECTTIMEOUT: "15"
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # The checkout has no data. scripts/refresh.py decides whether to
      # re-extract the ~754 MB Overture buildings layer by looking at the
      # buildings manifest, so fetch the live one first. On the very first
      # run there is none and the extraction simply runs.
      - name: Fetch buildings manifest
        run: |
          mkdir -p alerts/data/buildings
          aws s3 cp "s3://${DATA_BUCKET}/${DATA_PREFIX}/buildings/manifest.json" \
            alerts/data/buildings/manifest.json || echo "No buildings manifest in the bucket yet; extraction will run."

      # The NCGS debris-flow layer is ~225k polygons for the WNC bbox and is
      # essentially static (last edited 2026-03; a susceptibility model, not a
      # feed). scripts/refresh.py caches it locally as cache/debris_flows.gpkg
      # with a 30-day TTL, but CI starts cold every run, so without this the
      # pipeline re-paginates all 225k features + re-runs the county/HUC12
      # spatial joins on every run (the dominant cost, ~10-20 min).
      #
      # Key by calendar month so the cache rotates ~monthly (matching the code's
      # 30-day TTL): within a month it's a hit and refresh.py skips the fetch;
      # the first run of a new month misses, re-fetches, and repopulates.
      - name: Compute cache month
        id: cachemonth
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache debris-flow gpkg
        uses: actions/cache@v4
        with:
          path: cache
          key: debris-gpkg-v1-${{ steps.cachemonth.outputs.ym }}
          # Fall back to the previous month's cache if this month hasn't been
          # built yet — refresh.py's TTL check then decides whether it's stale.
          restore-keys: |
            debris-gpkg-v1-

      # The freshness check keys off the manifest file's mtime, and the copy
      # above was written just now. Restore the manifest's true age from its
      # embedded `generated_at` timestamp so the 30-day TTL fires (~monthly)
      # as designed. Failure-safe: we never delete the manifest, so a failed
      # extraction just retries next run.
      - name: Restore buildings manifest mtime
        run: |
          python3 - <<'PY'
          import json, os, datetime, pathlib
          p = pathlib.Path("alerts/data/buildings/manifest.json")
          if p.exists():
              ts = json.loads(p.read_text())["generated_at"]
              t = datetime.datetime.fromisoformat(ts).timestamp()
              os.utime(p, (t, t))
              print(f"Restored {p} mtime -> {ts}")
          else:
              print("No buildings manifest present; extraction will run.")
          PY

      # The environment is fully pinned in environment.yml at the repo root
      # (same file for local setup), so every run uses identical library
      # versions. conda-forge provides libgdal-grib (the GRIB2 driver
      # rasterio needs to read MRMS), which plain pip rasterio wheels don't
      # reliably include; the pip-only packages (overturemaps, duckdb) are in
      # the file's pip section. The environment cache key includes the
      # file's contents, so editing a pin rebuilds the environment.
      - name: Set up environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true

      # A non-zero exit here fails the job and nothing below runs, so a
      # broken run never uploads. (Splitting the partial-success exit code
      # is a backlog item.)
      - name: Run refresh pipeline
        shell: bash -el {0}
        run: python scripts/refresh.py

      # Uploads never remove remote files: a CI checkout has no historical/ files
      # (those are regenerated by hand with --hindcast) and a monthly skip of
      # the buildings extract leaves only the manifest locally. Every file is
      # JSON, uploaded as application/json so CloudFront compresses it.
      - name: Upload buildings (one day)
        run: |
          aws s3 sync alerts/data/buildings "s3://${DATA_BUCKET}/${DATA_PREFIX}/buildings" \
            --content-type application/json \
            --cache-control "public, max-age=86400"

      - name: Upload alert data (five minutes)
        run: |
          aws s3 sync alerts/data "s3://${DATA_BUCKET}/${DATA_PREFIX}" \
            --exclude "buildings/*" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Refresh summary"
            echo "- Uploaded to: \`s3://${DATA_BUCKET}/${DATA_PREFIX}\`"
            echo "- Outcome: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
