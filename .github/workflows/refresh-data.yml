name: Refresh alert data (manual)

# Runs the full SIREN alerts pipeline (scripts/refresh.py) and uploads
# alerts/data/ straight to the data bucket. Nothing is committed to git.
#
# Off the schedule since 2026-10-27: the alerts dashboard has been offline
# since 2026-10-22, and the two datasets DFENS Simple still needs (building
# footprints and the debris-flow GeoPackage) are kept current by
# refresh-reference.yml. Run this by hand only to regenerate the alerts
# dashboard's own files.
#
# Cost: $0 — public repo. No secrets: every upstream source is public and
# the upload assumes an OIDC role (no stored AWS keys).

on:
  workflow_dispatch:

# Never run two refreshes at once.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  id-token: write   # assume the AWS role with OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::710482330128:role/landslides-github-prod
  DATA_BUCKET: landslidesncgs-data
  DATA_PREFIX: alerts/data

jobs:
  refresh:
    runs-on: ubuntu-latest
    # With the debris-flow GeoPackage downloaded from the bucket the run is
    # quick. The headroom is for a bucket without one yet, when refresh.py
    # re-fetches the ~225k NCGS debris polygons and augments them (10-20 min).
    timeout-minutes: 60

    # The `production` environment is what the IAM role's trust policy is
    # scoped to (sub = repo:nemac/landslides-ncgs:environment:production).
    environment: production

    env:
      # Stream refresh.py's progress live. Python block-buffers stdout when it
      # isn't a TTY (as in CI), so without this the logs stay dark until the
      # process exits, making a slow run impossible to diagnose in real time.
      PYTHONUNBUFFERED: "1"
      # Bound GDAL's HTTP layer. The MRMS reader opens remote GRIB via
      # rasterio "/vsigzip//vsicurl/<url>", which uses GDAL's HTTP client —
      # and unlike the requests-based fetchers it has NO default timeout. A
      # stalled connection to IEM's mtarchive server otherwise hangs the whole
      # job until the 45-min step timeout kills it (observed 2026-07-20). These
      # make a stuck read fail fast so the Pass1->RadarOnly->Pass2 fallback
      # chain can move on.
      GDAL_HTTP_TIMEOUT: "30"
      GDAL_HTTP_CONNECTTIMEOUT: "15"
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # The NCGS debris-flow layer is ~225k polygons and essentially static.
      # refresh-reference.yml keeps a GeoPackage of it in the data bucket;
      # download that rather than re-paginating the service (~10-20 min).
      - name: Fetch the debris-flow GeoPackage
        run: |
          mkdir -p cache
          aws s3 cp "s3://${DATA_BUCKET}/cache/debris_flows.gpkg" cache/debris_flows.gpkg \
            || echo "No GeoPackage in the bucket yet; refresh.py will fetch the layer itself."

      # The environment is fully pinned in environment.yml at the repo root
      # (same file for local setup), so every run uses identical library
      # versions. conda-forge provides libgdal-grib (the GRIB2 driver
      # rasterio needs to read MRMS), which plain pip rasterio wheels don't
      # reliably include; the pip-only packages (overturemaps, duckdb) are in
      # the file's pip section. The environment cache key includes the
      # file's contents, so editing a pin rebuilds the environment.
      - name: Set up environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true

      # A non-zero exit here fails the job and nothing below runs, so a
      # broken run never uploads. (Splitting the partial-success exit code
      # is a backlog item.)
      - name: Run refresh pipeline
        shell: bash -el {0}
        run: python scripts/refresh.py

      # The upload never removes remote files: a CI checkout has no
      # historical/ files (those are regenerated by hand with --hindcast).
      # buildings/ belongs to refresh-reference.yml and is excluded so this
      # run can neither overwrite nor remove it. Every file is JSON, uploaded
      # as application/json so CloudFront compresses it.
      - name: Upload alert data (five minutes)
        run: |
          aws s3 sync alerts/data "s3://${DATA_BUCKET}/${DATA_PREFIX}" \
            --exclude "buildings/*" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Refresh summary"
            echo "- Uploaded to: \`s3://${DATA_BUCKET}/${DATA_PREFIX}\`"
            echo "- Outcome: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
